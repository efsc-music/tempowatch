<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4efe6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>TempoWatch</title><style>
:root{font-family:Georgia,'Times New Roman',serif;color:#242222;background:#f4efe6}*{box-sizing:border-box}body{margin:0;min-height:100dvh}main{max-width:540px;margin:auto;padding:20px 16px 32px;text-align:center}h1{font-size:27px;letter-spacing:.08em;margin:8px 0 4px}.sub{font:13px system-ui,sans-serif;color:#756c65;margin:0 0 12px}.dial-wrap{width:min(100%,440px);margin:auto;filter:drop-shadow(0 5px 8px #0002)}svg{width:100%;display:block;touch-action:manipulation}.readout{margin:8px auto 12px;font:600 58px/1.1 system-ui,sans-serif;font-variant-numeric:tabular-nums}.readout small{font-size:19px;color:#756c65}.hint{font:14px system-ui,sans-serif;color:#6b625b;min-height:20px}.tap{display:block;width:100%;min-height:92px;border:0;border-radius:20px;background:#842c35;color:white;font:700 26px system-ui,sans-serif;box-shadow:0 5px 0 #541920;cursor:pointer;touch-action:manipulation}.tap:active{transform:translateY(3px);box-shadow:0 2px 0 #541920}.controls{display:flex;gap:10px;margin-top:15px;align-items:center;justify-content:center;flex-wrap:wrap;font:15px system-ui,sans-serif}.controls button{border:1px solid #a99f95;background:white;border-radius:12px;padding:11px 18px;font:600 14px system-ui,sans-serif}.controls label{display:flex;align-items:center;gap:7px}.controls input{width:20px;height:20px;accent-color:#842c35}.foot{font:12px/1.5 system-ui,sans-serif;color:#766c63;margin-top:16px}.red{fill:#9c3941}.black{fill:#282426}button:focus-visible,input:focus-visible{outline:3px solid #2d78b5;outline-offset:3px}
</style></head><body><main><h1>TEMPOWATCH</h1><p class="sub">Six-beat tempo measurement</p><div class="dial-wrap"><svg id="dial" viewBox="0 0 420 420" role="img" aria-label="TempoWatch-style analog tempo dial"><defs><radialGradient id="face"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#e9e1d6"/></radialGradient></defs><circle cx="210" cy="210" r="207" fill="#b9b5b0" stroke="#777" stroke-width="3"/><circle cx="210" cy="210" r="196" fill="url(#face)" stroke="#fff" stroke-width="3"/><g id="marks"></g><text x="210" y="252" text-anchor="middle" font-size="21" font-weight="bold" class="black">TEMPOWATCH</text><text x="210" y="271" text-anchor="middle" font-size="10" class="red" font-weight="bold">BEATS PER MINUTE · BASE 6</text><g id="smallhand"><line x1="210" y1="142" x2="210" y2="99" stroke="#272222" stroke-width="3" stroke-linecap="round"/><circle cx="210" cy="142" r="5" fill="#333"/></g><g id="bigHand"><line x1="210" y1="210" x2="210" y2="37" stroke="#242020" stroke-width="4" stroke-linecap="round"/><path d="M205 75 L210 60 L215 75" fill="#a43842"/><circle cx="210" cy="210" r="10" fill="#272222" stroke="#a69d93" stroke-width="2"/></g></svg></div><div class="readout" aria-live="polite"><span id="bpm">—</span> <small>BPM</small></div><div class="hint" id="hint">Tap on beat 1 to begin</div><button class="tap" id="tap">START · BEAT 1</button><div class="controls"><button id="reset">Reset</button><label><input type="checkbox" id="subdivide">Count eighth notes (÷ 2)</label></div><p class="foot">Tap again on beat 7. Six beat intervals are measured. The needle makes one revolution every 10 seconds. For best results, keep this app visible while measuring.</p></main><script>
const NS='http://www.w3.org/2000/svg',marks=document.getElementById('marks'),big=document.getElementById('bigHand'),small=document.getElementById('smallhand'),bpmEl=document.getElementById('bpm'),hint=document.getElementById('hint'),tap=document.getElementById('tap'),sub=document.getElementById('subdivide');let started=null,elapsed=null,mode='ready',raf=null;
function node(tag,attrs,text){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;marks.appendChild(n);return n}
function polar(radius,angle,cx=210,cy=210){let a=angle*Math.PI/180;return [cx+radius*Math.sin(a),cy-radius*Math.cos(a)]}
function line(r1,r2,a,color,width=1){let p=polar(r1,a),q=polar(r2,a);node('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:color,'stroke-width':width})}
function txt(r,a,t,color,size=13){let p=polar(r,a);node('text',{x:p[0],y:p[1]+size*.34,'text-anchor':'middle',fill:color,'font-size':size,'font-family':'Arial, sans-serif'},t)}
// Main hand: 10 seconds per turn. Tempo angle = 36 * (360 / tempo) degrees.
const tempos=[36,38,40,42,44,46,48,50,52,54,56,58,60,62,64,66,68,72,76,80,84,88,92,96,100,104,108,112,120,128,136,144,156,170,190,210,240,270,300,360];
for(let t of tempos){let a=(12960/t)%360;line(172,185,a,'#342f2c',t===36||t%12===0?2:1.3);txt(157,a,String(t),'#2d2927',t>=100?12:13)}
for(let s=0;s<10;s++){let a=s*36;line(127,140,a,'#9c3941',2);if(s>0)txt(112,a,String(s),'#9c3941',17)}
// 10-second subdial: each revolution of main hand advances one mark.
node('circle',{cx:210,cy:142,r:51,fill:'none',stroke:'#b88f8d','stroke-width':1});for(let i=0;i<10;i++){let a=i*36*Math.PI/180;let x=210+43*Math.sin(a),y=142-43*Math.cos(a);let x2=210+49*Math.sin(a),y2=142-49*Math.cos(a);node('line',{x1:x,y1:y,x2:x2,y2:y2,stroke:'#9c3941','stroke-width':1.5});let tx=210+32*Math.sin(a),ty=142-32*Math.cos(a);node('text',{x:tx,y:ty+4,'text-anchor':'middle',fill:'#9c3941','font-size':12,'font-family':'Arial'},i===0?'0':String(i))}
function hands(sec){big.setAttribute('transform',`rotate(${(sec*36)%360} 210 210)`);small.setAttribute('transform',`rotate(${(sec/10)*36} 210 142)`)}
function display(sec){if(sec===null){bpmEl.textContent='—';return}let measured=360/sec;let actual=measured/(sub.checked?2:1);bpmEl.textContent=Number.isFinite(actual)?actual.toFixed(1):'—';hint.textContent=`${sec.toFixed(2)} s · ${measured.toFixed(1)} measured BPM${sub.checked?' · ÷ 2':''}`}
function tick(){if(mode!=='running')return;elapsed=(performance.now()-started)/1000;hands(elapsed);hint.textContent=`Measuring… ${elapsed.toFixed(2)} s`;raf=requestAnimationFrame(tick)}
function start(){started=performance.now();elapsed=0;mode='running';bpmEl.textContent='—';tap.textContent='STOP · BEAT 7';tap.style.background='#3e5c50';tick()}
function stop(){elapsed=(performance.now()-started)/1000;mode='stopped';cancelAnimationFrame(raf);hands(elapsed);display(elapsed);tap.textContent='START NEW · BEAT 1';tap.style.background='#842c35'}
tap.addEventListener('click',()=>mode==='running'?stop():start());document.getElementById('reset').addEventListener('click',()=>{mode='ready';cancelAnimationFrame(raf);elapsed=null;started=null;hands(0);display(null);hint.textContent='Tap on beat 1 to begin';tap.textContent='START · BEAT 1';tap.style.background='#842c35'});sub.addEventListener('change',()=>{if(mode==='stopped')display(elapsed)});hands(0);
</script></body></html>
